<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loom Control Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0F1317;--panel:#161C22;--panel2:#1C232B;--line:#263039;--ink:#E8ECEF;--muted:#8C97A3;--dim:#5C6873;--accent:#B388FF;--busy:#2FB8A6;--blocked:#E8A33D;--alert:#F2542D;--idle:#3A454F;--hold:#5BA8FF;
 --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;height:100vh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 420px;grid-template-areas:"head head" "stage side" "foot side";overflow:hidden}
header{grid-area:head;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase}
h1 small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;text-transform:none;margin-left:10px}
.legend{display:flex;gap:14px;margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--ink)}
.legend .inf::before{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);border:1px solid var(--ink)}
.legend .sim::before{background:transparent;border:1px dashed var(--ink)}
select,button,input,textarea{font-family:var(--body);font-size:13px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
button{cursor:pointer} button:hover,select:hover{border-color:var(--muted)} button:focus-visible,select:focus-visible,.tab:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.play{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 14px;min-width:90px}
button.danger{border-color:#5a2a22;color:#F2A08F} button.on{border-color:var(--accent);color:var(--accent)}
#rec.rec{border-color:var(--alert);color:var(--alert);animation:blink 1.2s infinite} @keyframes blink{50%{opacity:.55}}
.toast div.rec{border-color:var(--busy);pointer-events:auto} .toast a{color:var(--ink)}
.speed{display:flex;gap:4px} .speed button{padding:5px 8px}
.status{font-family:var(--mono);font-size:12px;color:var(--muted)} .status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px} .status i.live{background:var(--busy)}
#stage{grid-area:stage;position:relative;min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:16px;top:14px;font-family:var(--mono);font-size:12px;color:var(--muted);pointer-events:none}
.hud b{display:block;font-family:var(--display);font-size:38px;font-weight:600;color:var(--ink);line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hud .lane{margin-top:10px} .hud .lane i{display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--ink)} .hud .lane i.b{background:var(--accent)}
.toast{position:absolute;right:16px;top:14px;max-width:440px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast div{background:rgba(22,28,34,.94);border-left:3px solid var(--alert);padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--ink);opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
.toast div.show{opacity:1;transform:none} .toast div.hold{border-color:var(--hold)} .toast div.drift{border-color:var(--blocked)} .toast div.cleared{border-color:var(--busy)} .toast div.inject{border-color:var(--accent)} .toast div.grouped{border-color:var(--muted)}
.stations{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
.stations div{flex:1 0 auto;min-width:66px;background:rgba(22,28,34,.88);border:1px solid var(--line);border-radius:3px;padding:6px 8px;font-family:var(--mono);font-size:11px;color:var(--muted);cursor:pointer}
.stations div.sel{border-color:var(--accent)} .stations div .id{font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.04em}
.stations div .st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stations div.alert{border-color:var(--alert)} .stations div.alert .id{color:var(--alert)} .stations div.silent .id{color:var(--blocked)}
footer{grid-area:foot;border-top:1px solid var(--line);background:var(--panel);padding:8px 16px 10px;display:grid;gap:6px}
#timeline{width:100%;height:50px;display:block}
.score{display:flex;gap:22px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap;min-height:30px}
.score b{font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}
.score b.good{color:var(--busy)} .score b.warn{color:var(--blocked)}
aside{grid-area:side;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 2px;font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.pane{flex:1;overflow:auto;padding:12px 14px}
.pane pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap;color:var(--ink)}
.pane h3{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:14px 0 8px;color:var(--ink)} .pane h3:first-child{margin-top:0}
.pane p{margin:0 0 10px;color:var(--muted);max-width:60ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--mono);font-size:12px;margin-bottom:10px} .kv span:nth-child(odd){color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-family:var(--mono);border:1px solid var(--line);color:var(--muted)}
.pill.m{border-color:var(--ink);color:var(--ink)} .pill.i{border-style:dashed;color:var(--ink)} .pill.s{border-style:dotted}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px} .row label{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.row input[type=number]{width:74px}
canvas.spark{width:100%;height:70px;display:block;background:var(--panel2);border:1px solid var(--line);border-radius:3px;margin:4px 0 10px}
.cap{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
textarea.cfg{width:100%;height:52vh;font-family:var(--mono);font-size:11.5px;line-height:1.45;resize:vertical;tab-size:2}
.err{color:#F2A08F;font-family:var(--mono);font-size:12px;white-space:pre-wrap;margin:6px 0}
.ok{color:#5FD8A4}
.lp{border-left:2px solid #2A3338;padding:6px 10px;margin:6px 0;font-family:var(--mono);font-size:11px;line-height:1.5}
.lp b{font-family:var(--sans,inherit);font-size:12px}
.lp span{color:var(--muted);margin-left:6px}
.lp div{color:var(--muted);margin-top:2px;white-space:pre-wrap}
.lp.raised{border-left-color:#F2A08F} .lp.drift{border-left-color:#E8C07A}
.lp.hold{border-left-color:#B79BE8} .lp.grouped{border-left-color:#2A3338}
.lp.quiet{border-left-color:#5FD8A4;color:var(--muted)}
.lp.cons{border-left-color:#B79BE8}
#caption{position:absolute;left:24px;right:24px;bottom:96px;max-width:900px;margin:0 auto;background:rgba(12,16,18,.94);border-left:3px solid #B79BE8;padding:14px 18px;font-size:15px;line-height:1.55;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;pointer-events:none;z-index:6}
#caption.show{opacity:1;transform:none}
#caption b{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:10px}
#story.on{color:#B79BE8;border-color:#B79BE8}
/* persona views: one twin, six lenses. Layout carries the horizon. */
.pv h4{font-family:var(--sans,inherit);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:600}
.pv h4 .muted{text-transform:none;letter-spacing:0;font-weight:400}
.vhead{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.vhead h3{margin:0}
.vhead span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.stat{flex:1 1 88px;background:#151C21;border:1px solid #222C33;border-radius:3px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--sans,inherit);font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.stat.good b{color:#5FD8A4} .stat.bad b{color:#F2A08F} .stat.warn b{color:#E8C07A} .stat.muted2 b{color:var(--muted)}
.banner{background:#1B1830;border-left:2px solid #B79BE8;padding:8px 10px;font-size:12px;margin:8px 0}
.andons{display:flex;flex-wrap:wrap;gap:4px}
.andon{flex:0 0 auto;min-width:62px;background:#151C21;border:1px solid #222C33;border-top:2px solid #3A4750;border-radius:2px;padding:5px 7px;display:flex;flex-direction:column;gap:1px}
.andon b{font-size:11px} .andon span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.andon i{font-style:normal;font-size:9px;color:var(--muted)}
.andon.a-ok{border-top-color:#3E8F6B} .andon.a-over{border-top-color:#E8C07A}
.andon.a-alert{border-top-color:#F2A08F;background:#231A19} .andon.a-sick{border-top-color:#B79BE8}
.andon.a-dark{border-top-color:#39434A;color:var(--muted)} .andon.a-part{border-top-color:#5A7C8F}
.voi{display:flex;flex-direction:column;gap:4px}
.voirow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#151C21;border:1px solid #222C33;border-radius:3px;padding:8px 10px}
.voirow>div:nth-child(2){font-size:12px}
.voin{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid #2A3338;border-radius:2px;padding:2px 6px}
.voic{font-family:var(--mono);font-size:12px;color:#5FD8A4}
.muted{color:var(--muted);font-size:11px}
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;margin:6px 0}
.tbl th{text-align:left;color:var(--muted);font-weight:400;border-bottom:1px solid #2A3338;padding:4px 6px}
.tbl td{padding:4px 6px;border-bottom:1px solid #1C2428;vertical-align:top}
.tbl tr.ok td{color:#5FD8A4} .tbl tr.err td{color:#F2A08F}
.events{font-family:var(--mono);font-size:11.5px;display:grid;gap:4px} .events div{padding:4px 8px;border-left:2px solid var(--line)} .events .raised{border-color:var(--alert)} .events .hold{border-color:var(--hold)} .events .drift{border-color:var(--blocked)} .events .cleared{border-color:var(--busy)} .events .inject{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.toast div{transition:none}}
</style></head><body>
<header>
  <h1>Loom <small>live twin · plant truth in front, Loom's belief behind</small></h1>
  <select id="scenario" aria-label="Line configuration"></select>
  <button class="play" id="play">Play</button>
  <button id="reset">Reset</button>
  <button id="story">▶ Story</button><button id="rec" title="Record this run as a self-contained replay page">● Record</button>
  <div class="speed" id="speed"><button data-s="10">10×</button><button data-s="30" class="on">30×</button><button data-s="120">120×</button><button data-s="300">300×</button></div>
  <span class="status"><i id="dot"></i><span id="conn">connecting</span></span>
  <div class="legend"><span>measured</span><span class="inf">inferred</span><span class="sim">simulated</span></div>
</header>
<section id="stage">
  <canvas id="gl"></canvas>
  <div class="hud"><b id="clock">00:00</b><span id="hudline"></span>
    <div class="lane"><i></i>plant — what is actually happening<br><i class="b"></i>Loom — what it can see, infer and forecast</div></div>
  <div id="caption"></div>
  <div class="toast" id="toast"></div>
  <div class="stations" id="strip"></div>
</section>
<footer>
  <canvas id="timeline"></canvas>
  <div class="score" id="score"></div>
</footer>
<aside>
  <div class="tabs" id="tabs">
    <button class="tab on" data-p="station">Station</button><button class="tab" data-p="inject">Inject</button><button class="tab" data-p="config">Line</button><button class="tab" data-p="supervisor">Floor</button><button class="tab" data-p="quality">Quality</button><button class="tab" data-p="maintenance">Maint.</button><button class="tab" data-p="ai">AI</button><button class="tab" data-p="manager">Mgr</button><button class="tab" data-p="leadership">Exec</button><button class="tab" data-p="events">Log</button>
  </div>
  <div class="pane" id="pane"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const api2=u=>fetch(u).then(r=>r.json());
const esc=x=>String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=t=>`${String(Math.floor(t/3600)).padStart(2,"0")}:${String(Math.floor(t%3600/60)).padStart(2,"0")}`;
const SRC=["measured","inferred","simulated"], STATE=["idle","busy","blocked"], HEALTH=["ok","silent","inconsistent"];
const COL={bg:0x0F1317,accent:0xB388FF,busy:0x2FB8A6,blocked:0xE8A33D,alert:0xF2542D,idle:0x3A454F,floor:0x141A20};
const VAR={"-":0xD9DEE3,sedan:0xD9DEE3,suv:0xB9C3CC,hatch:0xE6EBEF};
const S={meta:null,frame:null,prev:null,events:[],sel:null,pane:"station",three:null,detail:null,history:[]};
const api=(path,body)=>fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{}).then(r=>r.json());

// ---------- three.js ----------
function initThree(){
  const canvas=$("gl"); const r=new THREE.WebGLRenderer({canvas,antialias:true}); r.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene(); scene.background=new THREE.Color(COL.bg); scene.fog=new THREE.Fog(COL.bg,60,200);
  const cam=new THREE.PerspectiveCamera(38,1,0.1,400);
  scene.add(new THREE.HemisphereLight(0xBFD4E6,0x0F1317,0.9)); const sun=new THREE.DirectionalLight(0xFFFFFF,0.9); sun.position.set(-8,18,12); scene.add(sun);
  const orbit={theta:0.04,phi:1.14,dist:40,cx:0,drag:false,px:0,py:0};
  canvas.addEventListener("pointerdown",e=>{orbit.drag=true;orbit.px=e.clientX;orbit.py=e.clientY;canvas.setPointerCapture(e.pointerId)});
  canvas.addEventListener("pointermove",e=>{if(!orbit.drag)return;orbit.theta-=(e.clientX-orbit.px)*0.005;orbit.phi=Math.max(0.25,Math.min(1.45,orbit.phi-(e.clientY-orbit.py)*0.005));orbit.px=e.clientX;orbit.py=e.clientY});
  canvas.addEventListener("pointerup",e=>{orbit.drag=false; if(Math.hypot(e.clientX-orbit.downX,e.clientY-orbit.downY)<5)pickStation(e);});
  canvas.addEventListener("pointerdown",e=>{orbit.downX=e.clientX;orbit.downY=e.clientY;});
  canvas.addEventListener("pointermove",e=>{if(!orbit.drag)hoverStation(e);});
  canvas.addEventListener("wheel",e=>{e.preventDefault();orbit.dist=Math.max(8,Math.min(400,orbit.dist*(1+Math.sign(e.deltaY)*0.08)))},{passive:false});
  S.three={r,scene,cam,orbit,group:null,meshes:{}};
}
function label(text,color="#E8ECEF",size=64){const c=document.createElement("canvas");c.width=256;c.height=96;const g=c.getContext("2d");g.font=`600 ${size}px "Barlow Condensed","Arial Narrow",sans-serif`;g.fillStyle=color;g.textAlign="center";g.textBaseline="middle";g.fillText(text,128,52);const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));s.scale.set(2.6,1,1);return s;}
function buildScene(){
  const T=S.three, meta=S.meta; if(T.group)T.scene.remove(T.group);
  const g=new THREE.Group(); T.group=g; T.meshes={st:[],bel:[],cars:new Map(),bcars:new Map(),beacons:[],slots:[],bslots:[],labels:[]};
  let x=0,lastZone=null; const xs=[];
  meta.stations.forEach(s=>{ if(lastZone&&s.zone!==lastZone)x+=1.6; x+=0.9*Math.min(s.buffer,6)+1.0; xs.push(x); x+=2.2; lastZone=s.zone; });
  const width=x,cx=width/2; T.orbit.cx=cx; T.orbit.theta=0.0; T.orbit.phi=1.14; T.xs=xs;
  const cv=T.r.domElement, aspect=Math.max(1.2,(cv.clientWidth||1200)/(cv.clientHeight||600));
  T.orbit.dist=Math.max(16,(width/2+2.5)/(Math.tan(T.cam.fov*Math.PI/360)*aspect)*0.99);
  T.scene.fog.near=T.orbit.dist*1.3; T.scene.fog.far=T.orbit.dist*3.2; T.cam.far=T.orbit.dist*4; T.cam.updateProjectionMatrix();
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(width+14,16),new THREE.MeshLambertMaterial({color:COL.floor})); floor.rotation.x=-Math.PI/2; floor.position.set(cx,-0.41,-2.2); g.add(floor);
  const grid=new THREE.GridHelper(width+14,Math.round((width+14)/2),0x22303A,0x1B242C); grid.position.set(cx,-0.4,-2.2); g.add(grid);
  [0,-4.4].forEach(z=>{const m=new THREE.Mesh(new THREE.BoxGeometry(width+8,0.06,0.5),new THREE.MeshLambertMaterial({color:0x1F2A33}));m.position.set(cx,-0.36,z);g.add(m);});
  meta.stations.forEach((s,i)=>{
    const geo=new THREE.BoxGeometry(2.0,1.0,1.5);
    const mk=(z)=>{const mat=new THREE.MeshLambertMaterial({color:COL.idle,transparent:true,opacity:1});const m=new THREE.Mesh(geo,mat);m.position.set(xs[i],0.1,z);g.add(m);
      const edge=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0x8C97A3,transparent:true,opacity:0.6}));m.add(edge);m.userData.edge=edge;return m;};
    T.meshes.st.push(mk(0)); T.meshes.bel.push(mk(-4.4));
    const lb=label(s.id);lb.position.set(xs[i],1.35,0);g.add(lb); const lb2=label(s.id);lb2.position.set(xs[i],1.35,-4.4);g.add(lb2); T.meshes.labels.push(lb2);
    if(i===0||meta.stations[i-1].zone!==s.zone){const zl=label(s.zone.toUpperCase(),"#8C97A3",46);zl.scale.set(3.2,1.2,1);zl.position.set(xs[i]-1.2,3.4,-2.2);g.add(zl);}
    const slots=[],bslots=[];const n=Math.min(s.buffer,6);
    for(let k=0;k<n;k++){const sx=xs[i]-1.6-k*0.9;const mkSlot=z=>{const q=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.7,0.04,0.9)),new THREE.LineBasicMaterial({color:0x33404B}));q.position.set(sx,-0.3,z);g.add(q);return q;};slots.push(mkSlot(0));bslots.push(mkSlot(-4.4));}
    T.meshes.slots.push(slots);T.meshes.bslots.push(bslots);
    const bc=new THREE.Mesh(new THREE.ConeGeometry(0.35,0.8,4),new THREE.MeshBasicMaterial({color:COL.alert,transparent:true,opacity:0}));bc.position.set(xs[i],2.3,-4.4);bc.rotation.x=Math.PI;g.add(bc);T.meshes.beacons.push(bc);
  });
  const bm=new THREE.Mesh(new THREE.TorusGeometry(1.5,0.05,8,40),new THREE.MeshBasicMaterial({color:COL.accent,transparent:true,opacity:0}));bm.rotation.x=Math.PI/2;bm.position.set(0,-0.3,-4.4);g.add(bm);T.meshes.bn=bm;
  T.scene.add(g); applySensorLook();
}
function applySensorLook(){ // belief-lane boxes reflect instrumentation (live-editable)
  const T=S.three; S.meta.stations.forEach((s,i)=>{const m=T.meshes.bel[i]; const dark=s.sensors==="dark", partial=s.sensors!=="plc_full"&&!dark;
    m.userData.base=dark?0.12:partial?0.45:1.0; const e=m.userData.edge;
    if(dark){e.material=new THREE.LineDashedMaterial({color:0xB388FF,dashSize:0.2,gapSize:0.12});e.computeLineDistances();} else {e.material=new THREE.LineBasicMaterial({color:0x8C97A3,transparent:true,opacity:0.6});}
    T.meshes.labels[i].material.map=label(s.id,dark?"#B388FF":"#E8ECEF").material.map; T.meshes.labels[i].material.needsUpdate=true;});
}
function carMesh(color,wire){const geo=new THREE.BoxGeometry(0.82,0.34,0.56);

// ---------- persona views ----------
// Six roles, one twin. They differ in horizon, aggregation and which
// provenance marks are surfaced -- not in the underlying numbers, which all
// come from the same evidence pack the AI layer is handed. That is the point:
// a briefing and the screen a supervisor is looking at cannot disagree.
const PROV={measured:"m",inferred:"i",simulated:"s"};
const prov=k=>k?`<span class="pill ${PROV[k]||""}">${SRC[k]||k}</span>`:"";
const pct=x=>x==null?"—":`${Math.round(x*100)}%`;

function andon(st,takt){
  // Colour is state, not decoration: over takt is the thing a supervisor scans for.
  const c=st.cycle_s, over=c!=null&&c>takt*1.02;
  const cls=st.active_alert?"a-alert":(over?"a-over":(st.sensor_health!=="ok"?"a-sick":"a-ok"));
  return `<div class="andon ${cls}" title="${esc(st.id)} ${esc(st.zone)} · ${esc(st.sensors)}">
    <b>${esc(st.id)}</b>
    <span>${c==null?"—":c.toFixed(1)+"s"}</span>
    <i>${MARK[st.cycle_source]||""}</i>
  </div>`;
}
const MARK={measured:"●",inferred:"◐",simulated:"○"};

function vSupervisor(p){
  const takt=p.line.takt_s, o=p.output, bn=p.momentary_bottleneck;
  const over=p.stations.filter(s=>s.cycle_s!=null&&s.cycle_s>takt*1.02);
  const alerts=p.stations.filter(s=>s.active_alert);
  const dark=p.stations.filter(s=>s.sensors==="dark");
  let h=`<div class="vhead"><h3>Shift handover</h3><span>line ${esc(p.line.id)} · ${esc(p.line.now)} · horizon: this shift</span></div>`;
  h+=`<div class="stats">
    <div class="stat"><b>${o.vehicles_out}</b><span>out</span></div>
    <div class="stat"><b>${o.veh_per_h}</b><span>veh/h</span></div>
    <div class="stat muted2"><b>${o.takt_ceiling_per_h}</b><span>takt ceiling</span></div>
    <div class="stat ${alerts.length?"bad":"good"}"><b>${alerts.length}</b><span>open alerts</span></div>
    <div class="stat ${o.vehicles_unplaced?"warn":""}"><b>${o.vehicles_unplaced}</b><span>can't place</span></div>
  </div>`;
  if(bn)h+=`<div class="banner">Pace is set by <b>${esc(bn.station)}</b> — longest active period ${bn.active_min} min ${prov(bn.source)}</div>`;
  h+=`<h4>Andon</h4><div class="andons">${p.stations.map(s=>andon(s,takt)).join("")}</div>`;
  h+=`<h4>Act now</h4>`;
  if(alerts.length){
    h+=alerts.map(s=>`<div class="lp raised"><b>${esc(s.id)}</b><span>conf ${pct(s.active_alert.confidence)}</span>
      <div>Upstream blocks in ~${s.active_alert.eta_min} min. Cycle ${s.cycle_s}s vs takt ${takt}s${s.active_alert.inferred_share?` · ${pct(s.active_alert.inferred_share)} of the evidence inferred`:""}. Get a floater or rebalance before the ETA.</div></div>`).join("");
  } else if(over.length){
    h+=over.map(s=>`<div class="lp cons"><b>${esc(s.id)}</b><span>${s.cycle_s}s vs ${takt}s</span><div>Over takt but not forming a new block — the line has settled around it.</div></div>`).join("");
  } else h+=`<div class="lp quiet">Nothing to act on.</div>`;
  if(dark.length)h+=`<h4>Blind spots</h4><div class="lp grouped"><div>${dark.map(s=>esc(s.id)).join(", ")} report nothing; their state is reconstructed from neighbours and marked ◐.</div></div>`;
  return h;
}

function vQuality(p){
  const q=p.quality||{}, fpy=q.first_pass_yield||{};
  let h=`<div class="vhead"><h3>Containment memo</h3><span>line ${esc(p.line.id)} · ${esc(p.line.now)} · horizon: today</span></div>`;
  const ys=Object.entries(fpy).filter(([,v])=>v.n);
  h+=`<div class="stats">${ys.map(([k,v])=>`<div class="stat ${v.pct<95?"warn":"good"}"><b>${v.pct}%</b><span>${esc(k)} first-pass</span></div>`).join("")||`<div class="stat muted2"><b>—</b><span>no inspection yet</span></div>`}
    <div class="stat ${(q.holds||[]).length?"warn":""}"><b>${(q.holds||[]).length}</b><span>holds</span></div>
    <div class="stat ${(q.drift_alerts||[]).length?"warn":""}"><b>${(q.drift_alerts||[]).length}</b><span>drifts</span></div>
    ${(q.sample_requests||[]).length?`<div class="stat"><b>${q.sample_requests.length}</b><span>held off, sampling</span></div>`:""}</div>`;
  if((q.drift_alerts||[]).length){
    h+=`<h4>Drift at source</h4>`+q.drift_alerts.map(d=>`<div class="lp drift"><b>${esc(d.station)}.${esc(d.param)}</b><span>${esc(d.t)}</span>
      <div>${esc(d.direction)}, mean ${d.mean_now}, onset ~${esc(d.onset)}. ${d.min_to_limit==null?"No crossing projected.":(d.min_to_limit===0?"Already out of spec.":`Spec limit in ~${d.min_to_limit} min.`)}</div></div>`).join("");
  }
  if((q.holds||[]).length){
    h+=`<h4>Holds</h4>`+q.holds.map(x=>`<div class="lp hold"><b>Hold #${x.id}</b><span>${esc(x.t)} · ${esc(x.reason)}</span>
      <div>${x.sure.length} sure, ${x.uncertain.length} uncertain, ${x.already_exited.length} already left the line. Uncertain = built inside the onset margin, or the deciding parameter is not reported there — inspect those first.</div></div>`).join("");
  }
  // The abstentions are the half of the memo a holds-only view hides: where the
  // twin declined to scrap product because the evidence could not yet name the
  // cause, and what it asked for instead.
  if((q.sample_requests||[]).length){
    h+=`<h4>Held off, sampling instead <span class="muted">a hold it would not justify</span></h4>`
      +q.sample_requests.map(x=>`<div class="lp drift"><b>Sample #${x.id}</b><span>${esc(x.t)} · after ${x.fails_seen} fails</span>
      <div>Inspect ${x.vehicles.length} vehicle${x.vehicles.length===1?"":"s"} at ${esc(x.inspect_at)} next — ${x.vehicles.map(v=>"#"+v).join(", ")}. ${x.reason==="unseparated"?"Two causes explain the failures about equally well; these results separate them.":"The leading cause does not yet clear the break-even bar for a hold; holding now would scrap more good product than bad."}</div>
      <div class="muted">Leading: ${esc(x.top)}${x.rival?`<br>Rival: ${esc(x.rival)}`:""}</div></div>`).join("");
  }
  if((q.precision_curve||[]).length>1){
    h+=`<h4>How the decision moved <span class="muted">believed precision vs failures seen</span></h4><table class="tbl"><tr><th>fails</th><th>leading cause</th><th>posterior</th><th>n</th><th>action</th></tr>`
      +q.precision_curve.map(r=>`<tr><td>${r.fails}</td><td>${r.conditions.map(esc).join(" AND ")}</td><td>${r.posterior.toFixed(2)}</td><td>${r.n_under}</td><td>${r.action==="hold"?"<b>hold</b>":"sample"}</td></tr>`).join("")+`</table>`;
  }
  if((q.hypotheses||[]).length){
    h+=`<h4>Ranked hypotheses <span class="muted">evidence, not verdicts</span></h4><table class="tbl"><tr><th>condition</th><th>lift</th><th>defective under</th><th>vs otherwise</th><th>p</th></tr>`
      +q.hypotheses.map(x=>`<tr><td>${x.conditions.map(esc).join(" AND ")}</td><td>${x.lift}x</td><td>${x.defective_under[0]}/${x.defective_under[1]}</td><td>${x.defective_otherwise[0]}/${x.defective_otherwise[1]}</td><td>${x.p_value}</td></tr>`).join("")+`</table>`;
  }
  if((q.unreported_params||[]).length)h+=`<h4>Not reported to the twin</h4><div class="lp grouped"><div>${q.unreported_params.map(esc).join(", ")} — these cannot be used to decide a hold.</div></div>`;
  if(!(q.drift_alerts||[]).length&&!(q.holds||[]).length&&!(q.hypotheses||[]).length&&!(q.sample_requests||[]).length)h+=`<div class="lp quiet">Nothing pending.</div>`;
  return h;
}

// Sub-minute gains were being rounded to "0.0 min" and then hidden, which made
// a list that IS ranked by warning gained look arbitrarily ordered. Show the
// quantity the ranking uses, in the unit it is meaningful in.
function leadGain(s){
  if(s==null)return "";
  if(s<=0)return " · no extra warning yet";
  return s<60?` · +${s.toFixed(0)}s of warning`:` · +${(s/60).toFixed(1)} min of warning`;
}

function money(x){return "$"+Math.round(x).toLocaleString();}
function vExec(p){

  const sv=r.sensitivity||{};

  h+=`<div class="banner">Basis: ${esc(r.basis)}${r.lead_from_this_line?"":" — this line has not faulted yet, so the warning figure is ours, not theirs. After two weeks of shadow mode it is replaced by the plant's own."}</div>`;
  h+=`<div class="stats">
    <div class="stat good"><b>${money(r.total)}</b><span>annual value</span></div>
    <div class="stat"><b>${r.lead_min==null?"—":r.lead_min.toFixed(1)}</b><span>min warning</span></div>
    <div class="stat ${r.false_alarms?"bad":"good"}"><b>${r.false_alarms}</b><span>false alarms</span></div>
    <div class="stat"><b>${r.payback_months==null?"—":r.payback_months.toFixed(1)}</b><span>months to payback</span></div></div>`;
  h+=`<h4>Where the value comes from <span class="muted">every input printed</span></h4><table class="tbl"><tr><th>line</th><th>arithmetic</th><th>per year</th></tr>`
    +r.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.formula)}</td><td>${money(l.value)}</td></tr>`).join("")
    +`<tr class="ok"><td><b>total</b></td><td></td><td><b>${money(r.total)}</b></td></tr>`
    +`<tr><td>cost</td><td>licence + retrofit of ${r.retrofit_stations} station(s)</td><td>${money(r.licence)}/yr + ${money(r.capex)} once</td></tr></table>`;
  h+=`<h4>If you don't believe the biggest assumption</h4>
    <div class="lp cons"><div>The whole case rests on <b>${money(sv.downtime_cost_per_min)}/min</b> of downtime. At a tenth of it the value is <b>${money(sv.at_one_tenth_total)}</b>/yr and payback is <b>${sv.at_one_tenth_payback_months==null?"never":sv.at_one_tenth_payback_months.toFixed(1)+" months"}</b>. The claim is not the number — it is that after two weeks of shadow mode the plant has its own number in place of ours.</div></div>`;
  h+=`<h4>Rollout</h4><div class="lp quiet"><div>Shadow 2 weeks → advisory → reversible automatic. The gate at each step is the trust ledger, not a date. Nothing that touches the physical line is ever automatic.</div></div>`;
  return h;
}

// ---------- story mode ----------
// A scripted run of the five demo scenes. It drives the same public API a
// person would click, so it is a rehearsal of the real demo rather than a
// separate code path -- and it is the failure plan if the live demo misbehaves.
const STORY=[
 {config:"healthy.yaml", speed:120, caption:"A healthy line. 12 stations, real cycle noise, two model variants. Loom raises nothing — and that is the hard part: the published false-alarm floor is 0.30 per 8 h."},
 {at:8, tab:"station", caption:"Every value carries its provenance: ● measured, ◐ inferred, ○ simulated. Nobody else shows an operator whether they are reading a measurement or a guess."},
 {config:"ramp_b3.yaml", speed:120, caption:"Now B3 starts wearing — 56 s drifting to 78 s over 20 minutes. Watch the front lane (the plant) and the lane behind it (what Loom believes)."},
 {at:45, tab:"station", caption:"Loom warns before the block: 'B2 blocks in ~7 min'. The forecaster fits the measured cycles, then simulates the buffer forward. The ETA is ○ simulated and says so."},
 {at:58, tab:"manager", caption:"And it scores itself. Warned at 43 min, blocked at 50 — that lead time goes in the ledger whether it flatters us or not."},
 {config:"ramp_b3_dark.yaml", speed:120, caption:"THE SAME FAULT, WITH B3 DARK. B3 now reports nothing at all. A threshold alarm has nothing to threshold and never fires."},
 {at:50, tab:"station", caption:"Loom still warns — 6.0 min of lead, reconstructed from B2 and B4 alone. This is the whole thesis: the plant everybody actually has is partly blind."},
 {config:"weld_drift_b2.yaml", speed:120, caption:"A different failure: B2's weld current sags out of spec. No cycle-time symptom at all — the line looks perfectly healthy."},
 {at:45, tab:"quality", caption:"CUSUM catches it at source and opens a targeted hold — 12.8 minutes before end-of-line inspection sees the first weak weld. 77 vehicles held instead of a blanket 90."},
 {at:60, tab:"ai", caption:"The AI layer writes the briefings from that evidence and nothing else — and the grounding check catches it if it ever reaches for a number the evidence does not contain."},
];
let storyIx=-1, storyT0=null;
function storyStop(msg){
  storyIx=-1; $("story").classList.remove("on"); $("story").textContent="▶ Story";
  const c=$("caption"); if(c)c.classList.remove("show");
  if(msg)toast({t:0,kind:"inject",text:msg});
}
async function storyStep(){
  if(storyIx<0)return;
  const sc=STORY[storyIx];
  if(!sc){storyStop("Story complete");return;}
  // Go through afterLoad, not just the API: otherwise the scene, the strip
  // and the scenario picker all keep describing the previous line.
  if(sc.config){const r=await api("/api/load",{name:sc.config}); if(r.meta)afterLoad(r.meta);}
  if(sc.speed)await api("/api/control",{speed:sc.speed,playing:true});
  if(sc.tab){S.pane=sc.tab;setTab();renderPane();}
  const c=$("caption"); c.innerHTML=`<b>${storyIx+1}/${STORY.length}</b> ${esc(sc.caption)}`; c.classList.add("show");
  storyIx++;
  const next=STORY[storyIx];
  if(!next)return void setTimeout(()=>storyStop("Story complete"),9000);
  if(next.at==null)return void setTimeout(storyStep,9000);
  storyT0=next.at*60;
  const wait=()=>{ if(storyIx<0)return;
    if(S.frame&&S.frame.t>=storyT0)storyStep(); else setTimeout(wait,300); };
  setTimeout(wait,600);
}

function voiRows(ns){
  if(!ns.length)return `<div class="lp quiet">Every station already reports — nothing to buy.</div>`;
  if(ns.every(r=>!r.extra_samples_per_h))
    return `<div class="lp quiet">Not enough history yet to price a retrofit. The ranking is measured by re-running the twin over what it has actually seen, so it needs a shift's worth of it — leave the line running.</div>`;
  return `<div class="voi">`+ns.map((r,k)=>`<div class="voirow"><div class="voin">${k+1}</div><div><b>${esc(r.station)}</b> <span class="muted">${esc(r.from)} → ${esc(r.to)}</span><div class="muted">+${r.extra_samples_per_h} measured cycles/h${leadGain(r.extra_lead_s)}</div></div><div class="voic">$${r.cost_usd.toLocaleString()}</div></div>`).join("")
    +`</div><p class="muted">Measured by re-running the twin over recent history with that station's profile flipped. Fits a scheduled maintenance window: a profile change is a config diff, not a line stop.</p>`;
}

function vManager(p){
  const L=p.ledger||{}, cov=p.coverage||{}, ns=p.next_sensor||[];
  const n=Object.keys(cov).length;
  const full=Object.values(cov).filter(v=>v==="plc_full").length;
  const darkN=Object.values(cov).filter(v=>v==="dark").length;
  const leads=(L.bottleneck||[]).filter(b=>b.lead_min!=null);
  const mean=leads.length?(leads.reduce((a,b)=>a+b.lead_min,0)/leads.length).toFixed(1):null;
  let h=`<div class="vhead"><h3>Trust ledger</h3><span>line ${esc(p.line.id)} · ${esc(p.line.now)} · horizon: week</span></div>`;
  h+=`<div class="stats">
    <div class="stat ${mean?"good":"muted2"}"><b>${mean??"—"}</b><span>min mean warning</span></div>
    <div class="stat ${L.false_alarms?"bad":"good"}"><b>${L.false_alarms??0}</b><span>false alarms</span></div>
    <div class="stat"><b>${L.alerts_raised??0}</b><span>alerts raised</span></div>
    <div class="stat"><b>${full}/${n}</b><span>fully instrumented</span></div>
    <div class="stat ${darkN?"warn":""}"><b>${darkN}</b><span>dark</span></div></div>`;
  if((L.bottleneck||[]).length){
    h+=`<h4>Every prediction, scored against what happened</h4><table class="tbl"><tr><th>station</th><th>warned</th><th>blocked</th><th>lead</th><th>ETA error</th><th>confidence</th></tr>`
      +L.bottleneck.map(b=>`<tr class="${b.lead_min>0?"ok":"err"}"><td>${esc(b.station)}</td><td>${esc(b.warned_at??"never")}</td><td>${esc(b.blocked_at??"—")}</td><td>${b.lead_min==null?"—":b.lead_min+" min"}</td><td>${b.eta_error_min==null?"—":b.eta_error_min+" min"}</td><td>${pct(b.confidence)}</td></tr>`).join("")+`</table>`;
  }
  if((L.containment||[]).length){
    h+=`<h4>Containment</h4><table class="tbl"><tr><th>defect</th><th>held</th><th>vs blanket</th><th>precision</th><th>recall</th><th>escaped</th></tr>`
      +L.containment.map(c=>`<tr><td>${esc(c.defect)} @ ${esc(c.cause_station)}</td><td>${c.hold_size}</td><td>${c.blanket_hold_size}</td><td>${pct(c.precision)}</td><td>${pct(c.recall)}</td><td>${c.escaped}</td></tr>`).join("")+`</table>`;
  }
  // U5: value of information as a fundable roadmap, not a line of text.
  h+=`<h4>What to instrument next <span class="muted">ranked by what it buys</span></h4><div id="voi_box">`;
  if(ns.length){
    h+=voiRows(ns);
  } else h+=`<div class="lp quiet">Working out what a retrofit would buy — re-running the twin with each dark station's profile flipped…</div>`;
  h+=`</div><h4>Coverage</h4><div class="andons">`+Object.entries(cov).map(([k,v])=>`<div class="andon ${v==="dark"?"a-dark":(v==="plc_full"?"a-ok":"a-part")}"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("")+`</div>`;
  return h;
}

// Maintenance: horizon is the week, and the only question is what needs
// intervention and whether it can wait for the next scheduled window. So the
// unit of the view is the asset, and every row carries the trend that dates it.
const M_ORDER={schedule:0,watch:1,unknown:2,ok:3};
function vMaintenance(p){
  const mt=p.maintenance;
  if(!mt)return `<div class="lp quiet">This twin is not reporting degradation trends yet.</div>`;
  const takt=p.line.takt_s;
  const assets=(mt.assets||[]).slice().sort((a,b)=>(M_ORDER[a.status]-M_ORDER[b.status])||((b.slope_s_per_min??-99)-(a.slope_s_per_min??-99)));
  const due=mt.due||[], watch=mt.watch||[], drift=mt.param_drift||[], faults=mt.sensor_faults||[];
  const soon=drift.filter(d=>d.outside_spec_now||d.min_to_limit!=null).map(d=>d.outside_spec_now?0:d.min_to_limit);
  const first=soon.length?Math.min(...soon):null;
  const cls=a=>a.status==="schedule"?"a-alert":a.status==="watch"?"a-over":a.status==="unknown"?"a-dark":(a.sensor_health!=="ok"?"a-sick":"a-ok");
  let h=`<div class="vhead"><h3>Maintenance window</h3><span>line ${esc(p.line.id)} · ${esc(p.line.now)} · horizon: this week</span></div>`;
  h+=`<div class="stats">
    <div class="stat ${due.length?"bad":"good"}"><b>${due.length}</b><span>due now</span></div>
    <div class="stat ${watch.length?"warn":""}"><b>${watch.length}</b><span>on watch</span></div>
    <div class="stat ${drift.length?"warn":"good"}"><b>${drift.length}</b><span>params drifting</span></div>
    <div class="stat ${first!=null?(first<=0?"bad":"warn"):"muted2"}"><b>${first==null?"—":(first<=0?"now":first)}</b><span>min to spec limit</span></div>
    <div class="stat ${faults.length?"bad":"good"}"><b>${faults.length}</b><span>sensor faults</span></div></div>`;
  if(due.length||first!=null){
    const parts=[];
    if(due.length)parts.push(`<b>${due.map(esc).join(", ")}</b> ${due.length>1?"are":"is"} at or trending past takt`);
    if(first!=null)parts.push(first<=0?`a parameter is <b>already outside spec</b>`:`a parameter reaches its spec limit in <b>~${first} min</b>`);
    if(!due.length&&first===0)parts.push(`no asset is over takt, so the line looks healthy from the floor`);
    h+=`<div class="banner">Cannot wait: ${parts.join(", and ")}. ${first!=null&&first<=0?"The crossing has already happened — that is a repair now, not a window.":"Intervene before the projected crossing — after it, the line is making scrap or losing takt."}</div>`;
  } else if(watch.length){
    h+=`<div class="banner">Nothing due. <b>${watch.map(esc).join(", ")}</b> ${watch.length>1?"are":"is"} trending up but below the t≥${mt.trend_threshold_tstat} evidence bar — this fits the next scheduled window.</div>`;
  } else {
    h+=`<div class="banner">Nothing due this week. No asset is trending up with enough evidence (t≥${mt.trend_threshold_tstat}) and no parameter is heading for a limit.</div>`;
  }
  h+=`<h4>Assets</h4><div class="andons">`+assets.map(a=>`<div class="andon ${cls(a)}" title="${esc(a.id)} ${esc(a.type)} · ${esc(a.zone)} · ${esc(a.sensors)}">
    <b>${esc(a.id)}</b><span>${a.slope_s_per_min==null?"—":(a.slope_s_per_min>=0?"+":"")+a.slope_s_per_min.toFixed(2)+"s/m"}</span><i>${esc(a.status)}</i></div>`).join("")+`</div>`;
  h+=`<h4>Degradation trend <span class="muted">cycle fitted over recent history, ◐ inferred</span></h4>
    <table class="tbl"><tr><th>asset</th><th>type</th><th>cycle</th><th>trend</th><th>t</th><th>to takt</th><th>status</th></tr>`
    +assets.map(a=>{
      const st=a.status;
      const eta=a.min_to_takt==null?(st==="unknown"?"no history":"—"):(a.min_to_takt<=0?"over now":`~${a.min_to_takt} min`);
      return `<tr class="${st==="schedule"?"err":st==="ok"?"ok":""}"><td>${esc(a.id)} <span class="muted">${esc(a.zone)}</span></td><td>${esc(a.type)}</td>
      <td>${a.effective_cycle_s==null?"—":`${MARK.inferred}${a.effective_cycle_s}s / ${takt}s`}</td>
      <td>${a.slope_s_per_min==null?"—":(a.slope_s_per_min>=0?"+":"")+a.slope_s_per_min.toFixed(2)+" s/min"}</td>
      <td>${a.tstat==null?"—":a.tstat}</td><td>${eta}</td><td>${esc(st)}</td></tr>`;
    }).join("")+`</table>`;
  if(drift.length){
    h+=`<h4>Process parameters heading for a limit</h4>`+drift.map(d=>`<div class="lp drift"><b>${esc(d.station)}.${esc(d.param)}</b><span>drifting ${esc(d.direction)} since ~${esc(d.onset)}</span>
      <div>Mean ${MARK.measured} ${d.mean_now} ${esc(d.unit)} against spec ${d.lsl}–${d.usl}. ${d.outside_spec_now?`Already outside the limit — this is a repair now, not a scheduled job${d.min_to_limit==null?"":` (the crossing was projected ~${d.min_to_limit} min out when the drift was first flagged)`}.`:(d.min_to_limit==null?"No crossing projected at the present rate — keep it on the watch list.":(d.min_to_limit<=0?"At the limit: this is a repair, not a scheduled job.":`At the rate seen at onset it crosses in ~${d.min_to_limit} min — inside this shift, not this week.`))}</div></div>`).join("");
  }
  const mons=(mt.param_monitors||[]).slice().sort((a,b)=>a.margin_pct_of_spec-b.margin_pct_of_spec).slice(0,6);
  if(mons.length){
    h+=`<h4>Margin to spec <span class="muted">tightest first</span></h4><table class="tbl"><tr><th>parameter</th><th>mean now</th><th>spec</th><th>margin</th><th>ewma (sd)</th><th>cusum lo/hi</th></tr>`
      +mons.map(m=>`<tr class="${m.drifting?"err":m.margin_pct_of_spec>25?"ok":""}"><td>${esc(m.station)}.${esc(m.param)}</td><td>${m.mean_now} ${esc(m.unit)}</td><td>${m.lsl}–${m.usl}</td>
        <td>${m.margin_pct_of_spec}%</td><td>${m.ewma_sd>=0?"+":""}${m.ewma_sd}</td><td>${m.cusum_lo}/${m.cusum_hi}</td></tr>`).join("")+`</table>`;
  }
  if(faults.length){
    h+=`<h4>Sensor health</h4>`+faults.map(f=>`<div class="lp raised"><b>${esc(f.station)}</b><span>${esc(f.sensors)}</span><div>Reporting <b>${esc(f.health)}</b> — the instrument is a maintenance job of its own, and until it is fixed this asset's trend is reconstructed, not measured.</div></div>`).join("");
  }
  const blind=mt.blind||[], untrended=mt.untrended||[], unrep=mt.unreported_params||[];
  if(blind.length||untrended.length||unrep.length){
    h+=`<h4>What the twin cannot see</h4><div class="lp grouped"><div>`
      +[blind.length?`${blind.map(b=>esc(b.station)).join(", ")} report nothing; their wear is reconstructed from neighbours and marked ◐.`:"",
        untrended.length?`${untrended.map(esc).join(", ")} have no usable cycle history yet — absence of a trend is not evidence of health.`:"",
        unrep.length?`${unrep.map(esc).join(", ")} are never reported, so no drift toward a limit can be seen there at all.`:""].filter(Boolean).join("<br>")
      +`</div></div>`;
  }
  return h;
}

function livePanel(){
  // Active = raised and not since cleared. The event stream is the same one
  // the store persists, so this panel and the audit trail cannot disagree.
  const active=new Map();
  (S.events||[]).forEach(e=>{
    if(e.kind==="raised")active.set(e.station,e);
    else if(e.kind==="cleared")active.delete(e.station);
  });
  const raisedN=(S.events||[]).filter(e=>e.kind==="raised").length;
  const holds=(S.events||[]).filter(e=>e.kind==="hold");
  const drifts=(S.events||[]).filter(e=>e.kind==="drift");
  const clean=t=>esc(String(t||"").replace(/^\[\s*[\d.]+\]\s*/,""));
  const card=(e,cls)=>`<div class="lp ${cls}"><b>${esc(e.station)}</b> <span>${fmt(e.t)}</span><div>${clean(e.text)}</div></div>`;
  let h=`<h3>Line now</h3><p>Front lane is the plant's truth, behind it is what Loom believes — solid measured, dashed inferred. Click any station for its panel.</p>`;
  // Two different questions, and conflating them is how a panel ends up saying
  // "all clear" while a station is visibly the constraint. A forecast alert is
  // about a block that is *forming*; once it has formed and the line adapts,
  // supply falls to the constraint's own rate, the buffer stops growing and
  // there is nothing left to forecast. The constraint has not gone away — it
  // has become the current one, which is what the active-period method reports.
  const bn=S.frame&&S.frame.bn;
  if(bn&&bn[1]>=2){
    h+=`<h3>Current constraint</h3><div class="lp cons"><b>${esc(bn[0])}</b><span>${SRC[bn[2]]}</span>`
      +`<div>Longest uninterrupted active period on the line (${bn[1]} min) — this is the station setting the pace right now.</div></div>`;
  }
  h+=`<h3>Forecast alerts</h3>`;
  h+= active.size ? [...active.values()].map(e=>card(e,"raised")).join("")
                  : `<div class="lp quiet">Nothing forming.${raisedN?` ${raisedN} raised earlier this run; once a block has formed and the line settles there is no longer a future event to predict — see the constraint above and the Log tab.`:" On a quiet line that is the correct output: the published false-alarm floor is 0.30 per 8 h."}</div>`;
  if(drifts.length){h+=`<h3>Process drift</h3>`+drifts.slice(-3).reverse().map(e=>card(e,"drift")).join("");}
  if(holds.length){h+=`<h3>Holds</h3>`+holds.slice(-3).reverse().map(e=>card(e,"hold")).join("");}
  const grouped=(S.events||[]).filter(e=>e.kind==="grouped");
  if(grouped.length){h+=`<h3>Grouped as consequences</h3><p class="muted">Blocked or starved by a constraint elsewhere — one alert, not eight.</p>`+grouped.slice(-3).reverse().map(e=>card(e,"grouped")).join("");}
  return h;
}
async function renderPane(){
  const el=$("pane"),m=S.meta,p=S.pane;
  if(p==="station"){const i=S.sel;if(i==null){el.innerHTML=livePanel();return;}
    const d=await api(`/api/station/${m.stations[i].id}`);S.detail=d;const pill=k=>`<span class="pill ${k==="measured"?"m":k==="inferred"?"i":"s"}">${k}</span>`;
    let h=`<h3>${d.id} <span class="pill">${d.type}</span> <span class="pill">${d.zone}</span> <span class="pill">${d.sensors}</span></h3>

    <span>cycle</span><span>true ${d.true_cycle_now}s (nominal ${d.nominal_cycle_s}s) · loom ${d.belief.cycle==null?"no estimate":d.belief.cycle+"s "+pill("inferred")}${d.belief.slope_s_per_min!=null?` · trend ${d.belief.slope_s_per_min>=0?"+":""}${d.belief.slope_s_per_min}s/min (t=${d.belief.tstat})`:""}</span>
    <span>samples</span><span>${d.belief.measured_samples} measured, ${d.belief.inferred_samples} inferred</span>
    <span>alert</span><span>${d.alert?`upstream blocks in ~${d.alert.eta_min} min · conf ${Math.round(d.alert.confidence*100)}% ${pill("simulated")}${d.alert.inferred_share?` · ${Math.round(d.alert.inferred_share*100)}% inferred evidence`:""} <button id="ack_c">confirm</button> <button id="ack_d">dismiss</button>`:"none"}</span>
    <span>sensor</span><span>${d.belief.health}${d.holds.length?` · holds #${d.holds.join(", #")}`:""}</span></div>
    <div class="cap"><span>cycle time (s) — plant solid, loom dashed</span><span>takt ${m.takt_s}s</span></div><canvas class="spark" id="sp_cyc"></canvas>`;
    d.params.forEach((q,k)=>{h+=`<div class="cap"><span>${q.name} (${q.unit}) — ${q.reported?"reported":"NOT reported to loom"} · true mean now ${q.true_mean_now}</span><span>ewma ${q.ewma} · cusum ${q.cusum_lo}/${q.cusum_hi}${q.drift?" · DRIFT":""}</span></div><canvas class="spark" id="sp_p${k}"></canvas>`;});
    el.innerHTML=h;
    spark($("sp_cyc"),[{pts:d.truth_cycles,color:"#E8ECEF",width:1.2},{pts:d.belief_cycles,color:"#B388FF",dash:[4,3],dots:true}],{lines:[m.takt_s]});
    if($("ack_c")){const ack=v=>api("/api/ack",{station:d.id,verdict:v}).then(r=>{toast({t:r.t,kind:"inject",text:`${d.id}: alert ${v}ed by operator`});renderPane();});$("ack_c").onclick=()=>ack("confirm");$("ack_d").onclick=()=>ack("dismiss");}
    d.params.forEach((q,k)=>spark($("sp_p"+k),[{pts:q.truth,color:"#E8ECEF",width:1.2},{pts:q.readings,color:"#2FB8A6",dots:true}],{lines:[q.lsl,q.usl,q.nominal]}));

  if(p==="inject"){const opts=m.stations.map(s=>`<option value="${s.id}">${s.id} · ${s.type} · ${s.sensors}</option>`).join("");const sid=S.injSel||m.stations[Math.min(2,m.stations.length-1)].id;

    el.innerHTML=`<h3>Inject a fault</h3><p>Changes hit the plant immediately; Loom only ever sees what the sensors let through.</p>
    <div class="row"><label>station <select id="inj_st">${opts}</select></label></div>
    <h3>Cycle time</h3><div class="row"><label>to <input type="number" id="inj_cyc" value="${Math.round(st.cycle_s*1.4)}"> s</label><label>ramp <input type="number" id="inj_ramp" value="20"> min</label><button id="inj_slow" class="danger">Wear</button><button id="inj_restore">Repair</button></div>
    <h3>Instrumentation</h3><div class="row">${m.profiles.map(pr=>`<button data-prof="${pr}" class="prof ${st.sensors===pr?'on':''}">${pr}</button>`).join("")}</div>
    <div class="row"><label>silent for <input type="number" id="inj_dur" value="25"> min</label><button id="inj_fault" class="danger">Sensor outage</button></div>
    <h3>Process drift</h3>${st.params.length?`<div class="row"><label>param <select id="inj_param">${st.params.map(q=>`<option>${q}</option>`).join("")}</select></label><label>over <input type="number" id="inj_dramp" value="25"> min</label><button id="inj_drift" class="danger">Drift out of spec</button><button id="inj_dstop">Back to nominal</button></div><p>Drifts a parameter's mean to just below its lower spec limit. A defect model must exist for it to cause defects (see the weld_drift_b2 line); otherwise you will see the drift warning and an out-of-spec hold.</p>`:"<p>This station has no monitored parameters.</p>"}`;
    $("inj_st").value=sid;$("inj_st").onchange=()=>{S.injSel=$("inj_st").value;renderPane();};
    const post=(b)=>api("/api/inject",b).then(r=>{if(r.error){alert(r.error);return;}S.events.push({...r,kind:"inject"});toast({...r,kind:"inject"});if(r.kind==="sensor"){api("/api/meta").then(mm=>{S.meta=mm;applySensorLook();renderPane();});}});
    $("inj_slow").onclick=()=>post({kind:"slow",station:sid,cycle_s:+$("inj_cyc").value,ramp_s:+$("inj_ramp").value*60});
    $("inj_restore").onclick=()=>post({kind:"restore",station:sid});
    [...el.querySelectorAll(".prof")].forEach(b=>b.onclick=()=>post({kind:"sensor",station:sid,profile:b.dataset.prof}));
    $("inj_fault").onclick=()=>post({kind:"sensor_fault",station:sid,duration_s:+$("inj_dur").value*60});
    if($("inj_drift")){$("inj_drift").onclick=()=>post({kind:"drift",station:sid,param:$("inj_param").value,ramp_s:+$("inj_dramp").value*60});$("inj_dstop").onclick=()=>post({kind:"drift_stop",station:sid});}
    return;}
  if(p==="config"){el.innerHTML=`<h3>Line configuration</h3><p>Edit the YAML and apply: stations, zones, cycle times, buffers, sensor profiles, model variants, scheduled faults. Applying rebuilds the plant and the twin from zero.</p><textarea class="cfg" id="cfg" spellcheck="false">${m.yaml.replace(/</g,"&lt;")}</textarea><div class="row"><button id="cfg_apply" class="play">Apply</button><button id="cfg_reload">Discard</button></div><div class="err" id="cfg_err"></div>`;
    $("cfg_apply").onclick=async()=>{const r=await api("/api/load",{yaml:$("cfg").value});if(r.error){$("cfg_err").textContent=r.error;return;}$("cfg_err").textContent="";afterLoad(r.meta);};
    $("cfg_reload").onclick=()=>renderPane();return;}
  if(p==="ai"){
    el.innerHTML=`<h3>AI layer</h3><p>The rule, and every panel below enforces it: <b>statistics and simulation produce every number; the model turns numbers into decisions, proposes hypotheses for the simulator to test, and drives the improvement loop through a gate it cannot bypass.</b> It never predicts, scores a vehicle, decides a hold or writes a number that is not in the evidence pack.</p>
    <h3>1 · Briefings — one evidence pack, three audiences</h3>
    <div class="row"><button id="rep_sup">Floor</button><button id="rep_q">Quality</button><button id="rep_m">Manager</button></div><div id="rep_out"></div>
    <h3>2 · What-if — the model proposes, the simulator judges</h3>
    <div class="row"><label>station <select id="wi_st"><option value="">auto (worst)</option>${m.stations.map(x=>`<option>${x.id}</option>`).join("")}</select></label><label>horizon <input type="number" id="wi_h" value="30"> min</label><button id="wi_go" class="play">Run</button></div><div id="wi_out"></div>
    <h3>3 · Improvement loop — propose, backtest, gate</h3>
    <div class="row"><label>iterations <input type="number" id="im_n" value="3"></label><button id="im_go">Run</button><span class="muted">slow: it re-runs recorded shifts</span></div><div id="im_out"></div>
    <h3>4 · Onboarding — a sentence becomes a plant</h3>
    <div class="row"><input id="ob_d" style="flex:1" value="18 stations, takt 72 s, 4 manual, 2 dark, paint buffer 10"><button id="ob_go">Draft</button></div><div id="ob_out"></div>
    <h3>5 · Grounding — the check that catches a fabricated number</h3>
    <div class="row"><button id="rt_go" class="danger">Run red team</button></div><div id="rt_out"></div>`;

    const mk=(id,persona)=>{$(id).onclick=async()=>{$("rep_out").innerHTML="<pre>working…</pre>";const r=await api(`/api/report/${persona}`,{});$("rep_out").innerHTML=r.error?`<div class="err">${r.error}</div>`:`<p>#${r.report_id} · ${r.provider} · evidence sha ${(r.evidence_sha256||"").slice(0,12)}… · ${r.grounded?"<b class='ok'>every number traced to the evidence pack</b>":"<b class='err'>unsupported: "+r.unsupported.join(", ")+"</b>"}</p><pre>${esc(r.text)}</pre>`;};};
    mk("rep_sup","supervisor");mk("rep_q","quality");mk("rep_m","manager");

    $("wi_go").onclick=async()=>{$("wi_out").innerHTML="<pre>simulating…</pre>";
      const r=await api("/api/whatif",{station:$("wi_st").value,horizon_min:+$("wi_h").value});
      if(r.error){$("wi_out").innerHTML=`<div class="err">${esc(r.error)}</div>`;return;}
      const b=r.baseline;const row=o=>`<tr><td>${esc(o.mitigation)}</td><td>${o.simulated_veh_per_h}</td><td>${o.simulated_upstream_blocked_min}</td><td>${o.simulated_first_block_min==null?"never":o.simulated_first_block_min+" min"}</td></tr>`;
      $("wi_out").innerHTML=`<p>Focus <b>${esc(r.focus_station)}</b> · next ${r.horizon_min} min · ${esc(r.inputs)} · provider ${r.provider}</p>
      <table class="tbl"><tr><th>option</th><th>veh/h</th><th>blocked min</th><th>first block</th></tr>${row({...b,mitigation:"do nothing (baseline)"})}${r.ranked.map(row).join("")}</table>
      <pre>${esc(r.explanation)}</pre>`;};

    $("im_go").onclick=async()=>{$("im_out").innerHTML="<pre>backtesting on recorded shifts…</pre>";
      const r=await api("/api/improve",{iterations:+$("im_n").value});
      if(r.error){$("im_out").innerHTML=`<div class="err">${esc(r.error)}</div>`;return;}
      const rows=r.iterations.map(i=>`<tr class="${i.accepted?'ok':'err'}"><td>${esc(JSON.stringify(i.proposal))}</td><td>${i.result.fa_per_8h}</td><td>${i.result.mean_lead_min==null?"—":i.result.mean_lead_min}</td><td>${i.accepted?"accepted":"rejected"}: ${esc(i.reason)}</td></tr>`).join("");
      $("im_out").innerHTML=`<p>Budget ${r.fa_budget_per_8h} false alarms / 8 h. Baseline ${r.baseline.fa_per_8h} FA, ${r.baseline.mean_lead_min} min lead. The gate decides, not the proposer.</p>
      <table class="tbl"><tr><th>proposal</th><th>FA/8h</th><th>lead</th><th>verdict</th></tr>${rows}</table>`;};

    $("ob_go").onclick=async()=>{$("ob_out").innerHTML="<pre>drafting…</pre>";
      const r=await api("/api/onboard",{description:$("ob_d").value});
      if(r.error){$("ob_out").innerHTML=`<div class="err">${esc(r.error)}</div>`;return;}
      $("ob_out").innerHTML=`<p>Validated by the loader · provider ${r.provider}. Assumptions it had to make:</p><ul>${r.assumptions.map(a=>`<li>${esc(a)}</li>`).join("")}</ul><pre>${esc(r.yaml)}</pre><p class="muted">Paste into the Line tab to run it.</p>`;};

    $("rt_go").onclick=async()=>{$("rt_out").innerHTML="<pre>checking…</pre>";
      const r=await fetch("/api/redteam").then(x=>x.json());
      if(r.error){$("rt_out").innerHTML=`<div class="err">${esc(r.error)}</div>`;return;}
      const rows=r.fixtures.map(f=>`<tr class="${f.correct?'ok':'err'}"><td>${esc(f.name)}</td><td>${f.sentence?esc(f.sentence):"<i>nothing — control</i>"}</td><td>${f.should_pass?"—":(f.correct?"caught":"MISSED")}</td></tr>`).join("");
      $("rt_out").innerHTML=`<p>Reports containing numbers this shift's evidence does not support, run through the same check that gates every stored report. <b>${r.caught}/${r.planted} caught, ${r.false_accusations} clean reports wrongly flagged.</b></p>
      <table class="tbl"><tr><th>fixture</th><th>planted sentence</th><th>result</th></tr>${rows}</table>
      <p class="muted">${esc(r.note)}</p>`;};
    return;}
  if(p==="events"){const au=await api("/api/audit");const c=au.counts||{};
    el.innerHTML=`<h3>Audit trail</h3><p>Persisted in SQLite (${c.path||"—"}): run ${c.run_id||"—"} · ${c.events||0} events the twin received · ${c.twin_events||0} alerts/holds/drifts · ${c.snapshots||0} belief snapshots · ${c.audit||0} actions · ${c.reports||0} AI reports.</p>
    <div class="row"><button id="rep_sup">Report: floor</button><button id="rep_q">Report: quality</button><button id="rep_m">Report: manager</button></div><div id="rep_out"></div>
    <h3>Actions</h3><div class="events">${(au.rows||[]).map(r=>`<div class="inject">${r.t==null?"":fmt(r.t)+"  "}<b>${r.actor}</b> ${r.action} ${JSON.stringify(r.detail).replace(/</g,"&lt;").slice(0,160)}</div>`).join("")||"<div>none</div>"}</div>
    <h3>Twin events</h3><div class="events">${S.events.slice().reverse().map(e=>`<div class="${e.kind}">${fmt(e.t)}  ${e.text.replace(/^\[\s*[\d.]+\]\s*/,"").replace(/</g,"&lt;")}</div>`).join("")||"<div>nothing yet</div>"}</div>
    <h3>AI reports</h3><div class="events">${(au.reports||[]).map(r=>`<div class="${r.grounded?'cleared':'raised'}">#${r.id} ${r.persona} · ${r.provider}/${r.model} · evidence ${r.evidence_sha256.slice(0,10)}… · ${r.grounded?"grounded":"UNGROUNDED: "+r.unsupported.join(", ")} · $${(r.cost_usd||0).toFixed(4)}</div>`).join("")||"<div>none yet</div>"}</div>`;
    const mk=(id,persona)=>{$(id).onclick=async()=>{$("rep_out").innerHTML="<pre>working…</pre>";const r=await api(`/api/report/${persona}`,{});$("rep_out").innerHTML=r.error?`<div class="err">${r.error}</div>`:`<p>#${r.report_id} · ${r.provider} · evidence sha ${(r.evidence_sha256||"").slice(0,12)}… · ${r.grounded?"every number traced to the evidence pack":"unsupported numbers: "+r.unsupported.join(", ")}</p><pre>${r.text.replace(/</g,"&lt;")}</pre>`;};};
    mk("rep_sup","supervisor");mk("rep_q","quality");mk("rep_m","manager");return;}
  const VIEWS={supervisor:vSupervisor,quality:vQuality,maintenance:vMaintenance,manager:vManager,leadership:vExec};
  if(VIEWS[p]){
    el.innerHTML=`<div class="pv"><div class="lp quiet">Reading the twin…</div></div>`;
    const pack=await api2("/api/pack");
    if(S.pane!==p)return;                       // the operator moved on
    el.innerHTML=`<div class="pv">${VIEWS[p](pack)}</div>`;
    if(p==="manager"){
      // VOI re-runs the twin per dark station, so it arrives after the view.
      api2("/api/voi").then(v=>{
        if(S.pane!=="manager")return;
        const box=$("voi_box"); if(!box)return;
        box.innerHTML=voiRows(v.next_sensor||[]);
      });
    }
    return;
  }
  const txt=await fetch(`/api/view/${p}`).then(r=>r.text());el.innerHTML=`<pre>${txt.replace(/</g,"&lt;")}</pre>`;
}
function afterLoad(meta){S.meta=meta;S.events=[];S.history=[];S.sel=null;S.frame=null;buildScene();buildStrip();$("scenario").value=meta.source;renderPane();refreshScore();}

// ---------- wiring ----------
initThree();
api("/api/meta").then(meta=>{const sel=$("scenario");meta.scenarios.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n.replace(".yaml","");sel.appendChild(o);});afterLoad(meta);connect();});
$("scenario").addEventListener("change",async()=>{const r=await api("/api/load",{name:$("scenario").value});if(r.meta)afterLoad(r.meta);});
$("play").addEventListener("click",()=>api("/api/control",{playing:!(S.frame&&S.frame.playing)}));
$("reset").addEventListener("click",async()=>{await api("/api/control",{reset:true});S.events=[];S.history=[];refreshScore();});
$("story").addEventListener("click",()=>{ if(storyIx>=0){storyStop("Story stopped");return;} storyIx=0; $("story").classList.add("on"); $("story").textContent="■ Stop story"; storyStep(); });
$("rec").addEventListener("click",async()=>{const on=!(S.frame&&S.frame.recording);const r=await api("/api/record",{on});if(r.error){alert(r.error);return;}
  if(!on){const el=$("toast");const d=document.createElement("div");d.className="rec";d.innerHTML=`Recorded ${r.minutes} min (${r.frames} frames) — <a href="${r.html}" target="_blank">open replay page</a> · <a href="${r.json}" download>data</a>`;el.appendChild(d);requestAnimationFrame(()=>d.classList.add("show"));setTimeout(()=>{d.classList.remove("show");setTimeout(()=>d.remove(),400)},30000);}});
[...$("speed").children].forEach(b=>b.addEventListener("click",()=>api("/api/control",{speed:+b.dataset.s})));
[...$("tabs").children].forEach(b=>b.addEventListener("click",()=>{S.pane=b.dataset.p;setTab();renderPane();}));
setInterval(()=>{if(["supervisor","quality","maintenance","manager","leadership"].includes(S.pane))renderPane(); if(S.pane==="station"&&S.sel!=null)renderPane();},4000);
setInterval(refreshScore,15000);
(function loop(){ if(S.frame){const mix=Math.min(1,(performance.now()-(S.mixT||0))/100); applyFrame(S.frame,S.prev,mix);} render(); requestAnimationFrame(loop); })();
</script>
</body></html>
