# Demo line: 12 stations in 3 zones. Every station is balanced to takt
# so the baseline flows cleanly; perturbations come in later configs.
name: demo-line
takt_s: 60
default_buffer: 2

zones:
  - name: body
    stations:
      - {id: B1, cycle_s: 55}
      - {id: B2, cycle_s: 57}
      - {id: B3, cycle_s: 56}
      - {id: B4, cycle_s: 58}
  - name: paint
    stations:
      - {id: P1, cycle_s: 55, buffer_before: 6}   # paint entry buffer
      - {id: P2, cycle_s: 58}
      - {id: P3, cycle_s: 56}
  - name: final
    stations:
      - {id: F1, cycle_s: 57}
      - {id: F2, cycle_s: 55}
      - {id: F3, cycle_s: 58}
      - {id: F4, cycle_s: 56}
      - {id: F5, cycle_s: 55}
