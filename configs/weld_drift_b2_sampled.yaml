# The same silent weld drift as weld_drift_b2.yaml, with B2's weld current
# logged as an audit sample -- one body in five -- instead of every body.
#
# This is the case the hold's onset back-fill exists for. When every vehicle
# carries its own reading, a hold can be assembled by reading them and the
# onset estimate never has to carry anything; the ablation measured the
# mechanism as inert for exactly that reason. At one reading in five, four of
# every five vehicles built during the drift have no reading at all, and the
# only thing that can put them in the hold is the estimated onset time. Same
# drift, same defect, same detection -- what changes is where recall comes from.
extends: weld_drift_b2.yaml
line:
  id: L1-weld-drift-b2-sampled
  zones:
    - name: body
      stations:
        - {id: B1, type: robot_weld, cycle_s: 55}
        - {id: B2, type: robot_weld, cycle_s: 57, sensors: plc_sampled}   # audit sample, 1 in 5
        - {id: B3, type: robot_weld, cycle_s: 56}
        - {id: B4, type: inspection, cycle_s: 58}
    - name: paint
      stations:
        - {id: P1, type: paint_booth, cycle_s: 55, buffer_before: 6}   # paint entry buffer
        - {id: P2, type: paint_booth, cycle_s: 58}
        - {id: P3, type: inspection,  cycle_s: 56}
    - name: final
      stations:
        - {id: F1, type: door_fit,   cycle_s: 57, sensors: plc_full}    # override type default
        - {id: F2, type: manual_fit, cycle_s: 55, sensors: plc_full}
        - {id: F3, type: manual_fit, cycle_s: 58, sensors: plc_full}
        - {id: F4, type: manual_fit, cycle_s: 56, sensors: plc_full}
        - {id: F5, type: inspection, cycle_s: 55}
